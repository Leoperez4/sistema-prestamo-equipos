spring.application.name=backend
server.port=8080

# Conexion a PostgreSQL (Docker, puerto 5433)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/prestamos}
spring.datasource.username=${DB_USER:prestamos}
spring.datasource.password=${DB_PASSWORD:prestamos_dev}

# El formato de las respuestas de error lo controla ManejadorDeErrores
# (@RestControllerAdvice), no la configuracion por defecto de Spring.

# Correo: en local apunta a MailHog (Docker), que captura los mensajes
# y los muestra en http://localhost:8025 sin enviarlos a internet.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
app.mail.remitente=${MAIL_FROM:no-reply@empresa-demo.local}
