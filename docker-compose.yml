services:
  db:
    image: postgres:16-alpine
    container_name: prestamos-db
    environment:
      POSTGRES_USER: prestamos
      POSTGRES_PASSWORD: prestamos_dev
      POSTGRES_DB: prestamos
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d

  mail:
    image: mailhog/mailhog:v1.0.1
    container_name: prestamos-mail
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata: